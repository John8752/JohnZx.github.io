<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>页面没有找到 · John</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <style>
      .not-found { display: grid; min-height: 100svh; padding: 32px; place-items: center; text-align: center; }
      .not-found strong { display: block; color: var(--blue); font-size: clamp(120px, 30vw, 320px); letter-spacing: -0.12em; line-height: .8; }
      .not-found h1 { margin: 36px 0 10px; font-size: clamp(30px, 5vw, 54px); letter-spacing: -.05em; }
      .not-found p { margin: 0 0 30px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <strong aria-hidden="true">404</strong>
        <h1>这里暂时什么都没有。</h1>
        <p>The page may have moved, or it never existed.</p>
        <a class="button button-primary" href="./">返回首页</a>
      </div>
    </main>
  </body>
</html>
